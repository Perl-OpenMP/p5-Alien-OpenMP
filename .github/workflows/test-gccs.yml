name: gcc-sweep
on: [push, pull_request]

jobs:
  gcc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gcc: ['10', '11', '12', '13', '14', '15', '16']
    container:
      image: gcc:${{ matrix.gcc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Perl build dependencies
        run: apt-get update && apt-get install -y curl make ca-certificates
      - name: Build Perl with matrix GCC
        run: |
          curl -L https://www.cpan.org/src/5.0/perl-5.42.0.tar.gz -o /tmp/perl.tar.gz
          tar -C /tmp -xzf /tmp/perl.tar.gz
          cd /tmp/perl-5.42.0
          ./Configure -des -Dprefix=/opt/perl -Dcc=gcc
          make -j2
          make install
          /opt/perl/bin/perl -V:cc -V:gccversion
      - name: Install dependencies and test
        run: |
          /opt/perl/bin/cpan -T App::cpanminus
          /opt/perl/bin/cpanm -n --installdeps .
          /opt/perl/bin/perl Makefile.PL
          make -j2
          /opt/perl/bin/prove -brv t
