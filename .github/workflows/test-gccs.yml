name: compiler-coverage

on: [push, pull_request, workflow_dispatch]

jobs:
  linux-gcc:
    name: ${{ matrix.cc }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC versions shipped on GitHub's GA Ubuntu images.
          - runner: ubuntu-22.04
            cc: gcc-10
          - runner: ubuntu-22.04
            cc: gcc-11
          - runner: ubuntu-22.04
            cc: gcc-12
          - runner: ubuntu-24.04
            cc: gcc-12
          - runner: ubuntu-24.04
            cc: gcc-13
          - runner: ubuntu-24.04
            cc: gcc-14

    steps:
      - uses: actions/checkout@v6

      - name: Show compiler
        shell: bash
        run: ${{ matrix.cc }} --version

      - name: Verify Alien::OpenMP compiler detection and flags
        shell: bash
        env:
          CC_UNDER_TEST: ${{ matrix.cc }}
        run: |
          set -euxo pipefail

          IFS=$'\t' read -r family cflags libs < <(
            perl .github/bin/compiler-profile.pl "$CC_UNDER_TEST"
          )

          test "$family" = gcc
          test "$cflags" = '-fopenmp'
          test "$libs" = '-fopenmp'

          cat > "$RUNNER_TEMP/openmp-probe.c" <<'EOF_C'
          #include <omp.h>
          #include <stdio.h>
          int main(void) {
          #ifndef _OPENMP
            return 2;
          #else
            printf("_OPENMP=%d max_threads=%d\n", _OPENMP, omp_get_max_threads());
            return omp_get_max_threads() < 1;
          #endif
          }
          EOF_C

          "$CC_UNDER_TEST" $cflags "$RUNNER_TEMP/openmp-probe.c" $libs -o "$RUNNER_TEMP/openmp-probe"
          OMP_NUM_THREADS=2 "$RUNNER_TEMP/openmp-probe"

  macos-gcc:
    name: ${{ matrix.cc }} / macOS
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # GNU GCC versions already installed on the GitHub macOS image.
        cc:
          - gcc-13
          - gcc-14
          - gcc-15

    steps:
      - uses: actions/checkout@v6

      - name: Show compiler
        run: ${{ matrix.cc }} --version

      - name: Verify GNU GCC is not mixed with LLVM libomp
        shell: bash
        env:
          CC_UNDER_TEST: ${{ matrix.cc }}
        run: |
          set -euxo pipefail

          IFS=$'\t' read -r family cflags libs < <(
            perl .github/bin/compiler-profile.pl "$CC_UNDER_TEST"
          )

          test "$family" = gcc
          test "$cflags" = '-fopenmp'
          test "$libs" = '-fopenmp'
          case "$libs" in
            *-lomp*) exit 1 ;;
          esac

          cat > "$RUNNER_TEMP/openmp-probe.c" <<'EOF_C'
          #include <omp.h>
          #include <stdio.h>
          int main(void) {
            printf("_OPENMP=%d max_threads=%d\n", _OPENMP, omp_get_max_threads());
            return omp_get_max_threads() < 1;
          }
          EOF_C

          "$CC_UNDER_TEST" -fopenmp "$RUNNER_TEMP/openmp-probe.c" -fopenmp -o "$RUNNER_TEMP/openmp-probe"
          OMP_NUM_THREADS=2 "$RUNNER_TEMP/openmp-probe"

  linux-clang:
    name: ${{ matrix.cc }} detection / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang versions shipped on GitHub's GA Ubuntu images.
          - runner: ubuntu-22.04
            cc: clang-13
          - runner: ubuntu-22.04
            cc: clang-14
          - runner: ubuntu-22.04
            cc: clang-15
          - runner: ubuntu-24.04
            cc: clang-16
          - runner: ubuntu-24.04
            cc: clang-17
          - runner: ubuntu-24.04
            cc: clang-18

    steps:
      - uses: actions/checkout@v6

      - name: Show compiler
        run: ${{ matrix.cc }} --version

      - name: Verify Clang detection and OpenMP compile flag
        shell: bash
        env:
          CC_UNDER_TEST: ${{ matrix.cc }}
        run: |
          set -euxo pipefail

          IFS=$'\t' read -r family cflags libs < <(
            perl .github/bin/compiler-profile.pl "$CC_UNDER_TEST"
          )

          test "$family" = clang
          test "$cflags" = '-fopenmp'

          # This checks the GitHub-provided compiler itself accepts OpenMP and
          # advertises _OPENMP.  Runtime/header availability is covered by the
          # platform integration tests where a matching libomp is present.
          printf '\n' | "$CC_UNDER_TEST" -fopenmp -dM -E - \
            | grep -qE '^[[:space:]]*#define[[:space:]]+_OPENMP[[:space:]]+[0-9]+'
